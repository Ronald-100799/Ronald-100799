<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Follow button — @ron_tamil</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/fonts/poppins-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 800; src: url("assets/fonts/poppins-latin-800-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #00FF00; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #00FF00; font-family: "Poppins", sans-serif; }
      .end { position: absolute; left: 90px; right: 90px; top: 830px; display: flex; align-items: center; gap: 24px;
             padding: 24px 26px; background: #FFFFFF; border-radius: 30px; box-shadow: 0 18px 40px rgba(0,0,0,0.30); }
      .end-av { width: 104px; height: 104px; flex: none; border-radius: 50%; padding: 4px; background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf); }
      .end-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 3px solid #fff; }
      .end-txt { flex: 1; display: flex; flex-direction: column; }
      .end-txt b { font-weight: 800; font-size: 40px; color: #101012; line-height: 1.1; }
      .end-txt span { font-weight: 600; font-size: 30px; color: #5b5b63; }
      .end-btn { position: relative; width: 230px; height: 78px; flex: none; }
      .end-btn span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 16px; font-weight: 800; font-size: 32px; }
      .b1 { background: #0095f6; color: #fff; }
      .b2 { background: #efefef; color: #101012; }
      .tap { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 6px solid rgba(255,255,255,0.95); box-shadow: 0 0 0 4px rgba(0,0,0,0.25); left: 820px; top: 853px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1080" data-height="1920" data-fps="30">
      <div class="end clip" id="card" data-start="0" data-duration="3.5" data-track-index="1" data-layout-allow-overlap>
        <div class="end-av"><img src="assets/avatar.jpg" alt="" /></div>
        <div class="end-txt"><b>ron_tamil</b><span>@ron_tamil</span></div>
        <div class="end-btn" data-layout-allow-overlap><span class="b2" data-layout-allow-overlap>Following</span><span class="b1" id="b1" data-layout-allow-overlap>Follow</span></div>
      </div>
      <div class="tap clip" id="tap" data-start="0" data-duration="3.5" data-track-index="2"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, y: 80, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 0.1);
      tl.fromTo("#tap", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 0.8, duration: 0.25, ease: "power2.in" }, 1.0);
      tl.to("#tap", { opacity: 0, scale: 1.4, duration: 0.3, ease: "power2.out" }, 1.25);
      tl.fromTo(".end-btn", { scale: 1 }, { scale: 0.9, duration: 0.09, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, 1.2);
      tl.to("#b1", { opacity: 0, duration: 0.12 }, 1.27);
      tl.to("#card", { opacity: 0, y: 60, scale: 0.95, duration: 0.35, ease: "power2.in" }, 3.1);
      tl.set({}, {}, 3.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
